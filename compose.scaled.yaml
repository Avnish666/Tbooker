# Standalone configuration: do not combine with compose.yaml (which publishes dev ports).
x-app: &app
  image: tbooker:local
  build: .
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 768m
  cpus: 1.0
  stop_grace_period: 35s
  environment: &app-environment
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tbooker}
    SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-tbooker}
    SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_SIZE:-20}
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
    DB_POOL_TIMEOUT_MS: ${DB_POOL_TIMEOUT_MS:-3000}
    DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-5s}
    DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-15s}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    PAYMENTS_MOCK_AMOUNT_MINOR: ${PAYMENTS_MOCK_AMOUNT_MINOR:-10000}
    PAYMENTS_MOCK_UPI_OUTCOME: ${PAYMENTS_MOCK_UPI_OUTCOME:-SUCCESS}
    PAYMENTS_MOCK_CARD_OUTCOME: ${PAYMENTS_MOCK_CARD_OUTCOME:-SUCCESS}
    REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-200ms}
    REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-200ms}
    CATALOGUE_CACHE_ENABLED: ${CATALOGUE_CACHE_ENABLED:-true}
    CACHE_METADATA_TTL: ${CACHE_METADATA_TTL:-PT10M}
    CACHE_METADATA_LIST_TTL: ${CACHE_METADATA_LIST_TTL:-PT5M}
    CACHE_SHOW_TTL: ${CACHE_SHOW_TTL:-PT1M}
    CACHE_SHOW_LIST_TTL: ${CACHE_SHOW_LIST_TTL:-PT30S}
    MESSAGING_ENABLED: ${MESSAGING_ENABLED:-true}
    MESSAGING_SCHEDULING_ENABLED: ${MESSAGING_SCHEDULING_ENABLED:-true}
    BOOKING_EVENTS_TOPIC: ${BOOKING_EVENTS_TOPIC:-tbooker.booking-confirmed.v1}
    BOOKING_EVENTS_DLT: ${BOOKING_EVENTS_DLT:-tbooker.booking-confirmed.v1.DLT}
    BOOKING_NOTIFICATION_GROUP: ${BOOKING_NOTIFICATION_GROUP:-tbooker-notifications-v1}
    BOOKING_ANALYTICS_GROUP: ${BOOKING_ANALYTICS_GROUP:-tbooker-analytics-v1}
    BOOKING_TOPIC_PARTITIONS: ${BOOKING_TOPIC_PARTITIONS:-3}
    BOOKING_TOPIC_REPLICAS: ${BOOKING_TOPIC_REPLICAS:-1}
    OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
    OUTBOX_RETRY_INITIAL: ${OUTBOX_RETRY_INITIAL:-PT1S}
    OUTBOX_RETRY_MAX: ${OUTBOX_RETRY_MAX:-PT1M}
    BOOKING_CONSUMER_RETRIES: ${BOOKING_CONSUMER_RETRIES:-3}
    KAFKA_DELIVERY_TIMEOUT_MS: ${KAFKA_DELIVERY_TIMEOUT_MS:-5000}
    KAFKA_REQUEST_TIMEOUT_MS: ${KAFKA_REQUEST_TIMEOUT_MS:-2000}
    KAFKA_MAX_BLOCK_MS: ${KAFKA_MAX_BLOCK_MS:-1000}
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    JWT_ISSUER: ${JWT_ISSUER:-tbooker}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-tbooker-api}
    JWT_TTL: ${JWT_TTL:-PT15M}
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    SERVER_FORWARD_HEADERS_STRATEGY: framework
    SERVER_SHUTDOWN: graceful
    SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
    JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:ActiveProcessorCount=2
    RESERVATIONS_CLEANUP_DELAY_MS: ${RESERVATION_CLEANUP_MS:-30000}
    MESSAGING_POLL_MS: ${OUTBOX_POLL_MS:-1000}
    MESSAGING_TOPIC_CHECK_MS: 10000
    MESSAGING_METRICS_MS: 5000
    OUTBOX_LEASE: ${OUTBOX_LEASE:-PT30S}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}
    kafka: {condition: service_started}

services:
  app-a:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app-a
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tbooker}?ApplicationName=app-a
      SPRING_DATASOURCE_HIKARI_POOL_NAME: app-a
  app-b:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app-b
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tbooker}?ApplicationName=app-b
      SPRING_DATASOURCE_HIKARI_POOL_NAME: app-b
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    ports: ['${LB_BIND_ADDRESS:-127.0.0.1}:${LB_PORT:-8080}:8080']
    networks: [default, edge]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/upstreams.conf:/etc/nginx/tbooker-upstreams.conf:ro
    depends_on:
      app-a: {condition: service_healthy}
      app-b: {condition: service_healthy}
    cpus: 0.5
    mem_limit: 128m
    healthcheck:
      test: [CMD, wget, -Y, off, -q, -O, /dev/null, http://127.0.0.1:8080/nginx-health]
      interval: 5s
      timeout: 3s
      retries: 6
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tbooker}
      POSTGRES_USER: ${DB_USERNAME:-tbooker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    command: [postgres, -c, max_connections=160, -c, shared_preload_libraries=pg_stat_statements]
    volumes: [scaled_postgres:/var/lib/postgresql/data]
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 96mb, --maxmemory-policy, allkeys-lru]
    cpus: 0.5
    mem_limit: 128m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  kafka:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [scaled_kafka:/var/lib/kafka/data]
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, localhost:19092]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
volumes:
  scaled_postgres:
  scaled_kafka:

networks:
  # Only NGINX joins the host-facing bridge. Mock providers need no Internet.
  default:
    internal: true
  edge:
