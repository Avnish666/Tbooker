worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 2048; }
http {
    # No Authorization header, request body, or query string in access logs.
    log_format upstream '$request_id $request_method $uri $status upstream=$upstream_addr '
                        'upstream_status=$upstream_status seconds=$request_time';
    access_log /dev/stdout upstream;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream tbooker {
        zone tbooker 64k;
        include /etc/nginx/tbooker-upstreams.conf;
        keepalive 32;
    }
    server {
        listen 8080;
        client_max_body_size 16k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        keepalive_timeout 15s;
        location = /nginx-health { access_log off; return 200 'UP\n'; }
        location / {
            proxy_pass http://tbooker;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # This is the only trusted edge: replace client-supplied forwarding values.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Forwarded '';
            proxy_connect_timeout 1s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
            # Never replay even a GET automatically; caller controls retry semantics.
            proxy_next_upstream off;
            # Local diagnostic only, no user/token data. Remove at a public edge.
            add_header X-Tbooker-Upstream $upstream_addr always;
        }
    }
}
