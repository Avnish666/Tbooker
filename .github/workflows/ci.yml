name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Maven verify (Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: UTC
      # Test classes supply ephemeral JWT keys and container connection details.
      # Suppress MockMvc request/response dumps, which can contain test bearer tokens.
      SPRING_TEST_MOCKMVC_PRINT: NONE
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21 and Maven dependency cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Check Docker availability for Testcontainers
        run: docker info --format '{{.ServerVersion}}'

      - name: Run unit and integration tests
        timeout-minutes: 20
        run: ./mvnw clean verify --batch-mode --no-transfer-progress

      - name: Upload test reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
